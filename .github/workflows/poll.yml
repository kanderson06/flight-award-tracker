name: Poll award availability

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: poll
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run poller
        env:
          SEATSAERO_KEY: ${{ secrets.SEATSAERO_KEY }}
        run: python3 poll_awards.py

      - name: Commit results
        run: |
          git config user.name "award-poll-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes this run"
            exit 0
          fi
          git commit -m "poll $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase
          git push
